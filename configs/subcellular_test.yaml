# Quick Test Configuration for Subcellular Localization
# Reduced epochs for fast testing

output_dir: ./training_results/subcellular_test/

dataset:
  name: subcellular_localization
  task_type: localization
  train_path: datasets/subcellular_localization/subcellular_localization_train.lmdb
  valid_path: datasets/subcellular_localization/subcellular_localization_valid.lmdb
  test_path: datasets/subcellular_localization/subcellular_localization_test.lmdb
  max_sequence_length: 512

task:
  type: multiclass_classification
  num_classes: 10
  class_names:
    - Cell membrane
    - Cytoplasm
    - Endoplasmic reticulum
    - Golgi apparatus
    - Lysosome/Vacuole
    - Mitochondrion
    - Nucleus
    - Peroxisome
    - Plastid
    - Extracellular

model:
  class: ProteinClassificationLSTM
  embed_dim: 128
  hidden_dim: 256
  vocab_size: 21
  num_layers: 2
  bidirectional: true
  dropout: 0.3

criterion: ce
metrics:
  - accuracy
  - f1_macro
eval_metric: accuracy

augmentation:
  enabled: false
  intensity: 0.15
  probability: 0.7

optimizer:
  class: Adam
  lr: 1.0e-3
  weight_decay: 1.0e-5

scheduler:
  enabled: false

train:
  num_epochs: 3  # Quick test
  batch_size: 32
  num_workers: 0
  shuffle: true
  early_stopping:
    enabled: false  # Disabled for quick test
  gradient_clipping:
    enabled: true
    max_norm: 1.0

device:
  gpus: [0]
  mixed_precision: false

logging:
  log_interval: 10
  save_best_model: true
  save_last_model: false

seed: 42
